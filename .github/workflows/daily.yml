name: Daily watchlist check

on:
  schedule:
    # ~08:00 UK time (no DST awareness in GH Actions cron; drifts an hour in BST)
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      # Run from the Actions tab when venues or a programme have changed
      # wholesale: resolves every cinema listing to its Letterboxd film this
      # run, rather than the usual capped number a day. The dashboard's
      # Refresh button and check-for-new-log.yml dispatch without it.
      resolve_all_cinema_listings:
        description: "Resolve every cinema listing to a Letterboxd film (no daily cap; slower)"
        type: boolean
        default: false

# The dashboard's "Refresh data" button and check-for-new-log.yml can both
# trigger this on top of the daily cron — without this, two overlapping runs
# would race writing state to the database (one could start reading previous
# state before the other has finished saving its own run). Queue instead of
# canceling, since an in-progress run may already be partway through that.
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e .

      - name: Run watchlist check
        env:
          LETTERBOXD_USERNAME: ${{ secrets.LETTERBOXD_USERNAME }}
          SARAH_LETTERBOXD_USERNAME: ${{ secrets.SARAH_LETTERBOXD_USERNAME }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Signs the push notification for a film that's started streaming
          # (see notify.py); without it the run falls back to email.
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: python -m watchlist_justwatch.main ${{ inputs.resolve_all_cinema_listings && '--resolve-all-cinema-listings' || '' }}

      # dashboard.html is no longer committed to git — Pages deploys straight
      # from this workflow's own artifact upload below, which never touched
      # git history anyway, and committing a fresh ~12MB file on every run
      # (several times a day, since regenerate-dashboard.yml joined daily.yml
      # on this) was pure unbounded repo growth with no reader left that
      # needed it (see scripts/sync_dashboard_to_icloud.sh, which now pulls
      # from the public Pages URL instead of git).
      #
      # The watchlist check and email above are the parts that matter —
      # they've already succeeded by this point. Pages deployment is a
      # nice-to-have mirror of the dashboard; GitHub's Pages deploy step
      # occasionally has transient hiccups (e.g. right after first enabling
      # Pages), and those shouldn't mark the whole daily run as failed or
      # send an alarming failure email when the actual functionality worked.
      - name: Prepare Pages site
        continue-on-error: true
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html
          cp manifest.json _site/manifest.json
          cp sw.js _site/sw.js
          cp -r icons _site/icons

      - name: Upload Pages artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Note Pages deployment status
        if: steps.deployment.outcome == 'failure'
        run: echo "::warning::GitHub Pages deployment failed (transient hiccups are common) — the site will just show yesterday's build until the next successful run. Watchlist check, email, and state commit above are unaffected."
