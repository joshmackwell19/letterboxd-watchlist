name: Deploy Cloudflare Worker

# Only runs when worker/ actually changes — every other commit (dashboard
# code, config, the pipeline itself) never touches this at all.
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          # Quick search's /search-films needs a TMDB key, and the key this
          # repo already holds for the daily run is the same one — so it's
          # pushed to the Worker from here (wrangler secret put, on every
          # deploy, idempotent) rather than being a second copy someone has
          # to remember to set by hand in Cloudflare's dashboard.
          #
          # GITHUB_TOKEN and TRIGGER_SECRET are deliberately NOT listed:
          # they only exist on Cloudflare's side, this repo has no copy of
          # them, and naming them here would upload empty values over the
          # real ones.
          secrets: |
            TMDB_API_KEY
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
