name: Deploy Cloudflare Worker

# Only runs when worker/ actually changes — every other commit (dashboard
# code, config, the pipeline itself) never touches this at all.
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
