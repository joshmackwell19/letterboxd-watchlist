name: Regenerate dashboard

# Triggered by the Cloudflare Worker behind the dashboard's Settings save,
# recommendation dismiss, and Review tab yes/no buttons — all three only
# ever change how already-fetched data is classified/rendered (services.yaml,
# dismissed_recommendations.yaml, or the watch_together table), never
# something that needs a fresh Letterboxd/JustWatch/TMDB scrape. Splitting
# this out from daily.yml means those three, plus a backlog of Review-tab
# taps, don't each cost a multi-minute full pipeline run.
on:
  workflow_dispatch:
    inputs:
      decisions:
        description: >-
          JSON array of {slug, status} to set (optional — omit for a plain
          regen). The Review tab debounce-batches taps client-side into one
          call here instead of dispatching a run per tap — see
          dashboard.py's queueDecision/flushPendingDecisions.
        required: false
        default: ""

# Deliberately no concurrency group. This used to share daily.yml's
# ("daily-pipeline"), but GitHub Actions concurrency only lets ONE run wait
# queued at a time — dispatching several taps within the ~30s a run takes
# (exactly what happens tapping through the Review queue) meant only the
# LAST one in each rapid burst actually ran; every earlier one was silently
# cancelled before its --set-watch-together-status ever executed, losing
# real decisions with no trace. Each run here only touches its own single
# watch_together row (its own tiny transaction, safe under any interleaving)
# and reads a transactionally-consistent snapshot of everything else for
# --dashboard — nothing here needs serializing against another run of
# itself, or against daily.yml's own separate concurrency-protected run.

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e .

      - name: Set watch-together statuses
        if: inputs.decisions != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Passed via env rather than spliced straight into the script —
          # ${{ }} expressions substitute as raw text before the shell ever
          # sees the line, so an interpolated value can (in principle) break
          # out of the quoting; going through a normal env var + shell
          # expansion avoids that regardless of what the JSON happens to
          # contain.
          DECISIONS_JSON: ${{ inputs.decisions }}
        run: python -m watchlist_justwatch.main --set-watch-together-statuses-batch "$DECISIONS_JSON"

      - name: Regenerate dashboard.html (no network calls)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m watchlist_justwatch.main --dashboard

      # Not committed to git (see daily.yml) — Pages deploys straight from
      # this run's own artifact upload below.
      #
      # Same reasoning as daily.yml: the actual change (DB write + dashboard
      # regen) has already succeeded by this point — a transient Pages
      # hiccup shouldn't mark this run as failed.
      - name: Prepare Pages site
        continue-on-error: true
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html
          cp manifest.json _site/manifest.json
          cp -r icons _site/icons

      - name: Upload Pages artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
