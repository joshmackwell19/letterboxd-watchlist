name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

      # The Worker is JS and has no package.json (see the note at the top of
      # the test file) — node's own runner needs neither, so this is a step
      # rather than a second toolchain.
      - name: Run Worker tests
        run: node --test worker/test/*.test.mjs
